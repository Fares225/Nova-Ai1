<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova AI — استوديو الأكواد (Code Workspace)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="code-workspace.css">
  <style>
    * { font-family: 'Cairo', system-ui, sans-serif; }
    textarea, code, pre, .console-output { font-family: 'Fira Code', monospace !important; }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(139, 92, 246, 0.15);
      color: #fff;
      border-color: #8b5cf6;
    }
  </style>
</head>

<body>

  <div class="workspace">

    <!-- Header -->
    <header class="topbar">

      <div class="brand">
        <a href="index.html" class="nav-btn" title="الرجوع للدردشة">
          <i class="fa-solid fa-arrow-right"></i>
          الدردشة
        </a>

        <div class="brand-icon">✦</div>

        <div>
          <h1>Nova Code Studio</h1>
          <span>استوديو تحرير ومعاينة الأكواد</span>
        </div>
      </div>

      <div class="top-actions">

        <button id="clearBtn" class="tool-btn danger">
          🗑️ مسح
        </button>

        <button id="copyBtn" class="tool-btn">
          📋 نسخ
        </button>

        <button id="downloadBtn" class="tool-btn">
          💾 تنزيل
        </button>

        <button id="runBtn" class="run-btn">
          ▶ تشغيل
        </button>

      </div>

    </header>


    <!-- Main -->
    <main class="workspace-main">

      <!-- Editors -->
      <section class="editors-panel">

        <!-- HTML -->
        <div class="editor-card">

          <div class="editor-header">

            <div class="editor-title">
              <span class="file-icon html-icon">HTML</span>
              <span>index.html</span>
            </div>

            <span id="htmlLines">1</span>

          </div>

          <textarea
            id="htmlEditor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
          ></textarea>

        </div>


        <!-- CSS -->
        <div class="editor-card">

          <div class="editor-header">

            <div class="editor-title">
              <span class="file-icon css-icon">CSS</span>
              <span>style.css</span>
            </div>

            <span id="cssLines">1</span>

          </div>

          <textarea
            id="cssEditor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
          ></textarea>

        </div>


        <!-- JavaScript -->
        <div class="editor-card">

          <div class="editor-header">

            <div class="editor-title">
              <span class="file-icon js-icon">JS</span>
              <span>script.js</span>
            </div>

            <span id="jsLines">1</span>

          </div>

          <textarea
            id="jsEditor"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
          ></textarea>

        </div>

      </section>


      <!-- Preview -->
      <section class="preview-panel">

        <div class="preview-header">

          <div class="preview-title">
            <span class="status-dot"></span>
            معاينة حية (Live Preview)
          </div>

          <div class="preview-actions">

            <button id="refreshPreviewBtn" title="تحديث">
              ↻
            </button>

            <button id="fullscreenBtn" title="ملء الشاشة">
              ⛶
            </button>

          </div>

        </div>


        <iframe
          id="previewFrame"
          title="Nova Code Preview"
          sandbox="allow-scripts allow-forms allow-modals"
        ></iframe>


        <!-- Console -->
        <div class="console">

          <div class="console-header">

            <div>
              🖥️ Console
            </div>

            <button id="clearConsoleBtn">
              مسح
            </button>

          </div>

          <div id="consoleOutput" class="console-output">
            <div class="console-empty">
              Console جاهز...
            </div>
          </div>

        </div>

      </section>

    </main>


    <!-- Status Bar -->
    <footer class="statusbar">

      <div>
        <span class="online-dot"></span>
        Nova Code Workspace
      </div>

      <div id="statusText">
        جاهز
      </div>

    </footer>

  </div>


  <div id="toast" class="toast"></div>


  <script src="code-workspace.js"></script>

</body>
</html>
